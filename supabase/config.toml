# Supabase local development configuration.
# Generated structure for the family tree project.
# Run `supabase init` with the Supabase CLI to generate the full config,
# or fill in your project details below.
#
# CLI install: brew install supabase/tap/supabase
# Docs: https://supabase.com/docs/guides/local-development

[project]
project_id = "family-tree"

[api]
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[local_smtp]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
# Local/CI only: skip email confirmation so signUp() returns a session
# immediately. The security tests (SEC-2, SEC-3) rely on this — without
# it they degrade to a skipped no-op every run. Never set this in a
# hosted/staging/prod Supabase project.
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
